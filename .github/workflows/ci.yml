name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: knowledge_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d knowledge_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: knowledge_manager
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Override DB to use Postgres service
          php -r "
          \$file = '.env';
          \$contents = file_get_contents(\$file);
          \$contents = preg_replace('/^DB_CONNECTION=.*/m', 'DB_CONNECTION=pgsql', \$contents);
          \$contents = preg_replace('/^DB_HOST=.*/m', 'DB_HOST=127.0.0.1', \$contents);
          \$contents = preg_replace('/^DB_PORT=.*/m', 'DB_PORT=5432', \$contents);
          \$contents = preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=knowledge_manager', \$contents);
          \$contents = preg_replace('/^DB_USERNAME=.*/m', 'DB_USERNAME=postgres', \$contents);
          \$contents = preg_replace('/^DB_PASSWORD=.*/m', 'DB_PASSWORD=postgres', \$contents);
          file_put_contents(\$file, \$contents);
          "

      - name: Migrate database
        run: php artisan migrate --force

      - name: Run tests (sqlite in-memory unit/feature + Postgres suite)
        run: |
          php artisan config:clear --ansi
          vendor/bin/phpunit --testsuite Unit --testsuite Feature --testsuite Postgres

      - name: Check code style
        run: ./vendor/bin/pint --test

  ai-service:
    name: AI service (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # torch is installed from the CPU wheel index, mirroring the Dockerfile:
      # PyPI's plain torch resolves to a multi-gigabyte CUDA build this service
      # never uses.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
