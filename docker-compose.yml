services:

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:18
    container_name: knowledge-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  # -------------------------
  # Laravel Backend
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: knowledge-manager-backend

    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/var/www

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres


# -------------------------
  # Next.js Frontend (DEV)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: knowledge-manager-frontend
    restart: unless-stopped

    ports:
      - "3001:3000"

    command: npm run dev -- --hostname 0.0.0.0

    environment:
      # Browser reaches the backend through the host-mapped port.
      # NEXT_PUBLIC_* vars are read at runtime by `next dev` and inlined at build time by `next build`.
      NEXT_PUBLIC_API_URL: http://localhost:8001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      # Live host code into the container (same pattern as backend).
      # node_modules/.next keep the container's Linux build via anonymous volumes.
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend


volumes:
  postgres_data:

  