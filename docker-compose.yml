services:

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    # The stock postgres image ships without pgvector, so entry chunk
    # embeddings have nowhere to live. Same major version as before, so the
    # existing data volume carries over untouched.
    image: pgvector/pgvector:pg18
    container_name: knowledge-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -------------------------
  # Redis
  # -------------------------
  # Cache and queue backend. The app works without it (database cache and queue),
  # so it is additive: point CACHE_STORE at redis to use it, leave it at database
  # to ignore this container.
  redis:
    image: redis:7-alpine
    container_name: knowledge-manager-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -------------------------
  # Laravel Backend (nginx + PHP-FPM)
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: knowledge-manager-backend

    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - documents_data:/var/www/storage/app/documents

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8002
      # The synchronous path. The first call after a container start also pays
      # the lazy model load, so this is not only generation time.
      AI_SERVICE_TIMEOUT: "${AI_SERVICE_TIMEOUT:-120}"
      # Budget for a queued summary or chunk index, which is allowed to wait for
      # the model to load. Must exceed AI_SERVICE_TIMEOUT.
      AI_SERVICE_BACKGROUND_TIMEOUT: "${AI_SERVICE_BACKGROUND_TIMEOUT:-600}"
      # Budget for one queued assistant answer. Separate from the background
      # timeout above, which would also change what a summary may pick.
      # Must stay below GenerateAssistantAnswer::$timeout.
      AI_SERVICE_ANSWER_TIMEOUT: "${AI_SERVICE_ANSWER_TIMEOUT:-2400}"
      # Off by default, which is what turns backend_seconds below into an
      # up-front refusal rather than a job that dies at its own timeout.
      AI_ALLOW_SLOW_BACKENDS: "${AI_ALLOW_SLOW_BACKENDS:-false}"
      # Width of the vectors the AI service returns, and so of the vector
      # column. Changing it invalidates every stored chunk vector.
      AI_EMBEDDING_DIMENSION: "${AI_EMBEDDING_DIMENSION:-1024}"
      # Must exceed the slowest job's $timeout, or a worker re-reserves a job that
      # is still running.
      DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-3000}"
      # Cache store. Redis is reachable as a service in this file; leaving this
      # at database keeps the app working with no Redis at all.
      CACHE_STORE: "${CACHE_STORE:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      REDIS_CLIENT: "predis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s


# -------------------------
  # Next.js Frontend (DEV)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: knowledge-manager-frontend
    restart: unless-stopped

    ports:
      - "3001:3000"

    # node_modules lives in an anonymous volume so the host bind mount does not
    # hide it. That volume survives recreation, so install on every start to
    # pick up dependencies added since it was created.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      WATCHPACK_POLLING: "true"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next

    depends_on:
      - backend

  # -------------------------
  # AI Service (FastAPI + local summarization model)
  # -------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: knowledge-manager-ai-service
    restart: unless-stopped

    ports:
      - "8002:8002"

    volumes:
      - ./ai-service:/srv

    environment:
      AI_SUMMARY_BACKEND: "${AI_SUMMARY_BACKEND:-t5}"
      AI_MAX_INPUT_LENGTH: "${AI_MAX_INPUT_LENGTH:-512}"
      AI_MAX_NEW_TOKENS: "${AI_MAX_NEW_TOKENS:-150}"
      AI_NUM_BEAMS: "${AI_NUM_BEAMS:-1}"
      AI_NO_REPEAT_NGRAM_SIZE: "${AI_NO_REPEAT_NGRAM_SIZE:-3}"
      AI_REPETITION_PENALTY: "${AI_REPETITION_PENALTY:-1.15}"
      AI_STRIP_FORMATTING: "${AI_STRIP_FORMATTING:-true}"
      AI_DROP_CODE_BLOCKS: "${AI_DROP_CODE_BLOCKS:-true}"
      EMBEDDING_MAX_INPUT_LENGTH: "${EMBEDDING_MAX_INPUT_LENGTH:-8192}"
      LLM_DTYPE: "${LLM_DTYPE:-bfloat16}"
      LLM_MAX_NEW_TOKENS: "${LLM_MAX_NEW_TOKENS:-200}"
      LLM_THINKING: "${LLM_THINKING:-false}"
      LLM_REPETITION_PENALTY: "${LLM_REPETITION_PENALTY:-1.1}"
      # Which engine answers /rag. 'hf' loads the bundled Qwen checkpoint;
      # switch to 'ollama' to call the ollama service below instead, which is
      # how a larger or differently-trained model is used without rebaking this
      # image. See the ollama service, which is behind a profile.
      LLM_PROVIDER: "${LLM_PROVIDER:-hf}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      # Reranking is optional; this cross-encoder is fetched from the Hub on
      # first use and the backend falls back to fused order when absent.
      RERANK_MODEL: "${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s


  # -------------------------
  # Ollama (optional)
  # -------------------------
  # Not started by the default `docker compose up`: it is behind the 'ollama'
  # profile, because the bundled Qwen checkpoint already answers questions and
  # most deployments never switch. To use it:
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull "${OLLAMA_MODEL:-qwen2.5:0.5b}"
  #   set LLM_PROVIDER=ollama in .env
  ollama:
    image: ollama/ollama:latest
    container_name: knowledge-manager-ollama
    profiles: ["ollama"]
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    volumes:
      - ollama_data:/root/.ollama


  # -------------------------
  # Mailpit
  # -------------------------
  mailpit:
    image: axllent/mailpit
    container_name: knowledge-manager-mailpit
    restart: unless-stopped
    volumes:
            - ./data:/data
    ports:
      - "8025:8025" # for the web UI
      - "1025:1025" # for SMTP
    environment:
            MP_MAX_MESSAGES: 5000
            MP_DATABASE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
    

volumes:
  postgres_data:
  documents_data:
  frontend_next:
  redis_data:
  ollama_data:

  