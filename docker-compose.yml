services:

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:18
    container_name: knowledge-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  # -------------------------
  # Laravel Backend
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: knowledge-manager-backend

    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5434
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres


# -------------------------
  # Next.js Frontend
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: knowledge-manager-frontend
    restart: unless-stopped

    ports:
      - "3001:3000"

    command: npm run dev -- --hostname 0.0.0.0

    depends_on:
      - backend


volumes:
  postgres_data:

  