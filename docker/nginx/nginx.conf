server {
    listen 8000;
    listen [::]:8000;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Must stay above upload_max_filesize/post_max_size (see
    # backend/docker/uploads.ini) so PHP, not nginx, rejects oversized bodies.
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Laravel storage files (e.g. /storage/uploads/...)
    location ~ ^/storage/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Do not expose hidden files (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}