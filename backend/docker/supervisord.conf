[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Summaries and assistant answers are queued, so without this worker the rows
; accumulate and neither is ever produced.
;
; --timeout must clear the slowest job's own budget (GenerateAssistantAnswer),
; or the worker is killed mid-answer. Stay below DB_QUEUE_RETRY_AFTER.
[program:queue]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=2760
directory=/var/www
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0